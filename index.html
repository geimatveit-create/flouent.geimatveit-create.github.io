<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flouent Client | Minecraft 1.21.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #09090e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Анимированный фоновый градиент */
        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            filter: blur(120px);
            opacity: 0.15;
            animation: pulseBg 8s infinite alternate;
            z-index: -1;
        }

        @keyframes pulseBg {
            0% { transform: scale(1) translate(-50px, -50px); }
            100% { transform: scale(1.3) translate(50px, 50px); }
        }

        .container {
            text-align: center;
            background: rgba(24, 24, 32, 0.7);
            backdrop-filter: blur(10px);
            padding: 45px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(124, 58, 237, 0.3);
            max-width: 420px;
            width: 100%;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        p {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.6);
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #d1d5db;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #38bdf8;
            color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Flouent Client</h1>
        <p>Лучший чит-клиент для Minecraft 1.21.1 (Fabric)</p>
        
        <!-- Кнопка скачивания / перехода -->
        <a href="#" class="btn">Скачать Flouent</a>
        
        <!-- Кнопка твоего Discord / Сообщества -->
        <a href="#" class="btn btn-secondary">Discord Сервер</a>
    </div>

</body>
</html>
