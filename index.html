<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flouent | Твоя будущая зависимость</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #050508;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Неоновые градиенты на фоне */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.1) 0%, transparent 40%),
                linear-gradient(45deg, rgba(124, 58, 237, 0.05) 0%, rgba(6, 182, 212, 0.05) 100%);
            z-index: -2;
            pointer-events: none;
        }

        /* Светящиеся неоновые полосы по бокам */
        .neon-line {
            position: fixed;
            width: 2px;
            height: 100vh;
            background: linear-gradient(180deg, transparent, #7c3aed, #06b6d4, transparent);
            opacity: 0.3;
            z-index: -1;
        }
        .neon-line.left { left: 8%; }
        .neon-line.right { right: 8%; }

        .section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            width: 100%;
            padding: 40px;
        }

        .section-center {
            justify-content: center;
        }

        .container {
            text-align: center;
            background: rgba(18, 18, 26, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(124, 58, 237, 0.25);
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }

        .section-left {
            justify-content: flex-start;
            padding-left: 10%;
        }

        .container-left {
            text-align: left;
            background: rgba(15, 15, 22, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 80px 70px;
            border-radius: 28px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.85);
            border: none;
            max-width: 850px;
            width: 100%;
            position: relative;
        }

        .container-left::before {
            content: '';
            position: absolute;
            left: 0;
            top: 15%;
            height: 70%;
            width: 5px;
            background: linear-gradient(180deg, #7c3aed, #06b6d4);
            border-radius: 4px;
            box-shadow: 0 0 20px #7c3aed;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #c084fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        .container-left h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        p {
            color: #9ca3af;
            font-size: 16px;
            margin-bottom: 35px;
        }

        .container-left p {
            font-size: 20px;
            max-width: 650px;
        }

        .btn {
            display: inline-block;
            padding: 16px 36px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 6px 20px rgba(124, 58, 237, 0.45);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.7);
            background: linear-gradient(135deg, #8b5cf6, #7c3aed);
        }

        .btn-telegram {
            background: linear-gradient(135deg, #0088cc, #005f9e);
            box-shadow: 0 6px 20px rgba(0, 136, 204, 0.45);
        }

        .btn-telegram:hover {
            background: linear-gradient(135deg, #229ed9, #0088cc);
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.7);
        }

        .alert-text {
            color: #d1d5db;
            font-size: 19px;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 650px;
        }
    </style>
</head>
<body>

    <div class="neon-line left"></div>
    <div class="neon-line right"></div>

    <div class="section section-center" id="main">
        <div class="container">
            <h1>Flouent</h1>
            <p>Твоя будущая зависимость</p>
            <button class="btn" onclick="document.getElementById('closed-stage').scrollIntoView({ behavior: 'smooth' });">Скачать Flouent</button>
        </div>
    </div>

    <div class="section section-left" id="closed-stage">
        <div class="container-left">
            <h1>Закрытый бета-тест</h1>
            <div class="alert-text">
                Софт находится в закрытой стадии. Вы можете перейти в Telegram и следить за новостями.
            </div>
            <a href="https://t.me/+Ix5UmUgspoUyNWJk" target="_blank" class="btn btn-telegram">Перейти в Telegram</a>
        </div>
    </div>

</body>
</html>
